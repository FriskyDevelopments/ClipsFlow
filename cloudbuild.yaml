# Cloud Build pipeline for the ClipsFlow API (Cloud Run).
# Distinct service name (clipsflow-api) so it never collides with the
# Python bot's "clipsflow-bot". Trigger on the go-live branch, or run:
#   gcloud builds submit --config cloudbuild.yaml .
substitutions:
  _REGION: us-central1
  _SERVICE: clipsflow-api
  _REPO: clipsflow
  _BUCKET: ${PROJECT_ID}-clipsflow-data

steps:
  # Build
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - build
      - '-t'
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:$COMMIT_SHA'
      - '-t'
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:latest'
      - '.'

  # Push
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', '--all-tags', '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}']

  # Ensure the durable data bucket exists (idempotent)
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: bash
    args:
      - -c
      - |
        gcloud storage buckets describe gs://${_BUCKET} >/dev/null 2>&1 || \
          gcloud storage buckets create gs://${_BUCKET} --location=${_REGION} --uniform-bucket-level-access

  # Deploy to Cloud Run. max-instances=1 because the JSON file store is not
  # safe across multiple instances; data persists on a GCS-backed volume.
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE}
      - '--image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:$COMMIT_SHA'
      - '--region=${_REGION}'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--min-instances=0'
      - '--max-instances=1'
      - '--cpu=1'
      - '--memory=512Mi'
      - '--port=3000'
      - '--set-env-vars=NODE_ENV=production,CLIPS_DATA_DIR=/app/data'
      - '--add-volume=name=data,type=cloud-storage,bucket=${_BUCKET}'
      - '--add-volume-mount=volume=data,mount-path=/app/data'

images:
  - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:$COMMIT_SHA'
  - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:latest'
