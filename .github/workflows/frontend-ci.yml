name: Frontend CI

on:
  push:
    branches: ["**"]
    paths:
      - 'frisky-signal-intake/**'
      - 'apps/web/**'
  pull_request:
    paths:
      - 'frisky-signal-intake/**'
      - 'apps/web/**'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'frisky-signal-intake/package-lock.json'

      - name: Install dependencies
        run: |
          cd frisky-signal-intake
          npm ci

      - name: Build
        run: |
          cd frisky-signal-intake
          npm run build

      - name: Lint
        run: |
          cd frisky-signal-intake
          npm run lint

  clipsflow-web:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'apps/web/package-lock.json'

      - name: Install dependencies
        run: |
          cd apps/web
          npm ci

      - name: Build
        run: |
          cd apps/web
          npm run build
