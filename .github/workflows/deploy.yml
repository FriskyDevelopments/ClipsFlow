name: Deploy Worker

# Deploys the ClipsFlow Worker to Cloudflare. Runs only when the Cloudflare
# credentials are configured as repo secrets, so it stays inert until then.
#
# Required repo secrets:
#   CLOUDFLARE_API_TOKEN   – token with Workers + D1 edit permissions
#   CLOUDFLARE_ACCOUNT_ID  – target Cloudflare account id
# Prerequisite: wrangler.toml has a real D1 database_id (see DEPLOY.md).

on:
  workflow_dispatch:
  push:
    branches: ["claude/clipsflow-go-live-1j0klh"]
    paths:
      - "src/**"
      - "migrations/**"
      - "wrangler.toml"
      - "package.json"
      - ".github/workflows/deploy.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply clipsflow --remote

      - name: Deploy
        run: npx wrangler deploy
